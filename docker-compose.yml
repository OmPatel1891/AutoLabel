version: '3.9'

services:
  # AutoLabel API server
  autolabel-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # persist labeled data
      - ./models:/app/models
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gradio review UI
  autolabel-ui:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - autolabel-api
    command: python -c "from autolabel_pipeline import ReviewUI; ui = ReviewUI({}); ui.launch()"
    restart: unless-stopped

  # Ollama LLaVA vision model server
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama  # persist downloaded models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_models:    # named volume so LLaVA survives container restarts
